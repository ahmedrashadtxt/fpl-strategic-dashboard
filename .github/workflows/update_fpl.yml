name: Update FPL Database

on:
  schedule:
    # Runs daily at 02:00 UTC (shortly after FPL price changes execute)
    - cron: '0 2 * * *'
    # Runs every 6 hours to capture transfer market trends
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute data fetch script
        run: python fetch_data.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fpl.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FPL database [skip ci]" && git push)